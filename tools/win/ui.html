<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iHypnusCare</title>
<style>
:root { --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e; --brand: #009fe3; --track: #e1e0d9; --border: rgba(11,11,11,0.10); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; user-select: none; }
.screen { display: none; flex-direction: column; align-items: center; text-align: center; max-width: 640px; padding: 24px; }
.screen.on { display: flex; }
.logo { height: 64px; margin-bottom: 14px; }
.small .logo { height: 44px; margin-bottom: 20px; }
h1 { font-size: 30px; font-weight: 600; margin: 0 0 10px; }
h2 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
.sub { color: var(--ink2); font-size: 15px; margin: 0 0 26px; max-width: 520px; }
ul { list-style: none; padding: 0; margin: 0 0 30px; text-align: left; }
li { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font-size: 14px; }
li svg { flex: none; }
button { font: inherit; cursor: pointer; }
.primary { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 10px 22px; font-size: 15px; font-weight: 600; }
.primary:hover { filter: brightness(0.95); }
.link { background: none; border: 0; color: var(--brand); margin-top: 16px; font-size: 13px; }
.hint { color: var(--ink2); font-size: 12.5px; margin-top: 10px; }
.path { color: var(--ink2); font-size: 12.5px; margin: 0 0 22px; word-break: break-all; }
.bar { width: 460px; max-width: 80vw; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 3px; transition: width 0.15s; }
.bar.indet i { width: 30%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
.count { font-size: 14px; font-weight: 500; margin-top: 14px; font-variant-numeric: tabular-nums; }
.detail { color: var(--ink2); font-size: 12.5px; margin: 4px 0 22px; min-height: 1.2em; }
.secondary { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 16px; }
.error { display: none; background: #fff; border: 1px solid #d03b3b; border-radius: 8px; padding: 10px 14px; color: var(--ink); margin: 0 0 18px; text-align: left; white-space: pre-wrap; font-size: 13px; max-width: 560px; }
.foot { color: var(--ink2); font-size: 11.5px; margin-top: 28px; }
</style>
</head>
<body>
<section class="screen on" id="welcome">
  <img class="logo" id="logo1" alt="Hypnus">
  <h1>iHypnusCare</h1>
  <p class="sub">Turn the SD card from your Hypnus CPAP machine into a clear therapy report.</p>
  <div class="error" id="error" role="alert"></div>
  <ul id="features"></ul>
  <button class="primary" id="open">Open SD Card or Folder…</button>
  <div class="hint">or drag the card or a folder onto iHypnusCare.exe</div>
  <button class="link" id="last" hidden></button>
  <div class="foot" id="foot">Unofficial. Not made or endorsed by Hypnus.</div>
</section>

<section class="screen small" id="loading">
  <img class="logo" id="logo2" alt="Hypnus">
  <h2>Reading your SD card…</h2>
  <div class="path" id="path"></div>
  <div class="bar indet" id="bar"><i></i></div>
  <div class="count" id="count">Starting…</div>
  <div class="detail" id="detail"></div>
  <button class="secondary" id="cancel">Cancel</button>
</section>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const ICON = {
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  list: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/>',
  doc: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 14h8M8 17h5"/>',
  lock: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><rect x="9" y="11" width="6" height="5" rx="1"/><path d="M10 11V9.5a2 2 0 0 1 4 0V11"/>',
};
const FEATURES = [
  ["chart", "Usage, AHI, pressure and leak trends for any date range"],
  ["moon", "Night-by-night detail showing every apnea and hypopnea"],
  ["list", "The compliance and therapy figures a sleep doctor looks for"],
  ["doc", "Export a PDF to share with your doctor"],
  ["lock", "Read-only: nothing on your SD card is ever changed"],
];
for (const [k, text] of FEATURES) {
  const li = document.createElement("li");
  li.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#009fe3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
  li.append(document.createTextNode(text));
  $("#features").append(li);
}
const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function show(id) { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id)); }
function showWelcome() { show("welcome"); }
function showError(msg) { const e = $("#error"); e.textContent = "Couldn't read that folder.\n\n" + msg; e.style.display = "block"; show("welcome"); }
function showLoading(path) {
  $("#error").style.display = "none";
  $("#path").textContent = path;
  $("#bar").className = "bar indet"; $("#bar i").style.width = "";
  $("#count").textContent = "Starting…"; $("#detail").textContent = "";
  show("loading");
}
function progress(done, total, folder, files) {
  const bar = $("#bar");
  const nf = (n) => n.toLocaleString("en");
  $("#count").textContent = `Folder ${nf(done)} of ${nf(total)}  ·  ${nf(files)} files read`;
  if (done >= total) { bar.className = "bar indet"; $("#bar i").style.width = ""; $("#detail").textContent = "Building the report…"; return; }
  bar.className = "bar"; $("#bar i").style.width = (100 * done / total).toFixed(1) + "%";
  const m = /^(\d{4})(\d{2})(\d{2})$/.exec(folder);
  $("#detail").textContent = m ? `Reading ${+m[3]} ${MON[+m[2] - 1]} ${m[1]}` : folder;
}

$("#open").addEventListener("click", () => window.pywebview.api.choose_folder());
$("#last").addEventListener("click", () => window.pywebview.api.open_last());
$("#cancel").addEventListener("click", () => window.pywebview.api.cancel());

window.addEventListener("pywebviewready", async () => {
  const info = await window.pywebview.api.info();
  $("#logo1").src = info.logo; $("#logo2").src = info.logo;
  $("#foot").textContent = `Version ${info.version}  ·  Unofficial. Not made or endorsed by Hypnus.`;
  if (info.last) {
    const name = info.last.split(/[\\/]/).filter(Boolean).pop();
    $("#last").textContent = `Open last folder: ${name}`;
    $("#last").hidden = false;
  }
});
</script>
</body>
</html>
